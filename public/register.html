<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация — Альбакор</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="/"><img src="/assets/logo-albacor-light.png" alt="Албакор"></a><div class="nav-actions" style="margin-left:auto"><a class="btn btn-outline" href="/login.html">Вход</a></div></div></header><main class="auth-wrap"><form id="auth-form" class="card auth-card" data-mode="register"><span class="eyebrow">Новый ученик</span><h1>Регистрация</h1><div class="form-grid"><div class="field"><label>Имя</label><input name="firstName" required></div><div class="field"><label>Фамилия</label><input name="lastName"></div><div class="field"><label>Телефон</label><input name="phone"></div><div class="field"><label>E-mail</label><input type="email" name="email" required></div><div class="field"><label>Пароль</label><input type="password" name="password" minlength="6" required></div><div class="field"><label>Повтор пароля</label><input type="password" name="password2" minlength="6" required></div></div><div id="auth-msg" class="msg"></div><button class="btn btn-primary" style="width:100%">Создать аккаунт</button><p style="font-size:12px;color:var(--muted)">Нажимая кнопку, пользователь подтверждает согласие с правилами сайта и обработкой персональных данных.</p></form></main><script src="/app.js"></script></body></html>
